<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Outer Shield Outline -->
  <path d="M 256 95 L 375 145 C 375 275 312 375 256 415 C 200 375 137 275 137 145 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Inner Shield Glow -->
  <path d="M 256 118 L 355 158 C 355 265 300 352 256 388 C 212 352 157 265 157 158 Z" 
        fill="rgba(11, 25, 44, 0.65)" stroke="url(#cyanGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Graduation Cap -->
  <!-- Top Diamond -->
  <polygon points="256,132 332,168 256,204 180,168" fill="url(#goldGrad)" />
  <!-- Cap Base -->
  <path d="M 204 185 L 204 214 C 204 234 308 234 308 214 L 308 185" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M 316 174 L 336 212 L 336 230" fill="none" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
  <circle cx="336" cy="234" r="5" fill="#FCD34D" />

  <!-- Stylized Letter 'H' -->
  <path d="M 204 240 L 204 365 M 308 240 L 308 365" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
  <!-- Dynamic Cyan Swoosh Crossbar -->
  <path d="M 194 310 Q 256 260 318 310" fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Stars -->
  <!-- Center Cyan Star -->
  <polygon points="256,52 261,66 276,66 264,75 268,89 256,80 244,89 248,75 236,66 251,66" fill="#38BDF8" />
  <!-- Left Gold Star -->
  <polygon points="210,68 214,79 226,79 216,86 220,98 210,90 200,98 204,86 194,79 206,79" fill="#F59E0B" />
  <!-- Right Gold Star -->
  <polygon points="302,68 306,79 318,79 308,86 312,98 302,90 292,98 296,86 286,79 298,79" fill="#F59E0B" />
</svg>
